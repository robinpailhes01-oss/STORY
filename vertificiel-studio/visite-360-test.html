<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visite 360° · test</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1410; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display: block; width: 100vw; height: 100dvh; touch-action: none; cursor: grab; }
  .tag { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); padding: 10px 16px; border-radius: 999px; background: rgba(16,24,20,.62); color: #fff; font-size: 14px; font-weight: 600; white-space: nowrap; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); pointer-events: none; transition: opacity .6s; }
  .brand { position: fixed; left: 16px; top: calc(14px + env(safe-area-inset-top, 0px)); color: #fff; font-weight: 800; font-size: 17px; text-shadow: 0 1px 6px rgba(0,0,0,.5); }
  .brand small { display: block; font-weight: 500; font-size: 12px; opacity: .85; }
</style>
</head>
<body>
<div class="brand">Vertificiel<small>Visite 360° · jardin de démonstration (test)</small></div>
<div class="tag" id="tag">Glissez pour regarder autour de vous</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const T = THREE, K = Math.PI * 9 / 21;                      // the panorama is cylindrical, 21:9: it reaches atan(K) = 53° up and down
  const renderer = new T.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1)); document.body.appendChild(renderer.domElement);
  const scene = new T.Scene(), camera = new T.PerspectiveCamera(62, 1, 0.01, 10);
  const tex = new T.TextureLoader().load("img/demo/pano-test.jpg", () => draw());
  tex.encoding = T.sRGBEncoding; renderer.outputEncoding = T.sRGBEncoding; tex.wrapS = T.RepeatWrapping; tex.repeat.x = -1; tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  scene.add(new T.Mesh(new T.CylinderGeometry(1, 1, 2 * K, 120, 1, true), new T.MeshBasicMaterial({ map: tex, side: T.BackSide })));
  let yaw = 0, pitch = 0, fov = 62, vel = 0, last = 0;
  function draw() {
    const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = fov; camera.updateProjectionMatrix();
    const lim = Math.max(0, Math.atan(K) - fov * Math.PI / 360 - 0.02); pitch = Math.max(-lim, Math.min(lim, pitch));
    camera.rotation.set(pitch, yaw, 0, "YXZ"); renderer.render(scene, camera);
  }
  const pts = new Map(); let pinch = 0;
  const cv = renderer.domElement;
  cv.addEventListener("pointerdown", e => { cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); vel = 0; document.getElementById("tag").style.opacity = 0; });
  cv.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId)) return;
    const p = pts.get(e.pointerId), dx = e.clientX - p[0], dy = e.clientY - p[1]; pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size === 2) { const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (pinch) fov = Math.max(35, Math.min(75, fov * pinch / d)); pinch = d; draw(); return; }
    const k = fov * Math.PI / 180 / innerHeight; yaw += dx * k; pitch += dy * k; vel = dx * k; last = performance.now(); draw();
  });
  const up = e => { pts.delete(e.pointerId); pinch = 0; if (performance.now() - last < 60 && Math.abs(vel) > 0.002) requestAnimationFrame(glide); };
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
  function glide() { if (pts.size || Math.abs(vel) < 0.0004) return; yaw += vel; vel *= 0.94; draw(); requestAnimationFrame(glide); }
  cv.addEventListener("wheel", e => { e.preventDefault(); fov = Math.max(35, Math.min(75, fov + e.deltaY * 0.03)); draw(); }, { passive: false });
  addEventListener("resize", draw); draw();
  window.__view = (y, p) => { yaw = y; pitch = p || 0; draw(); };
})();
</script>
</body>
</html>
