<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Visite 360° de votre jardin · Vertificiel</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1410; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff; }
  canvas { display: block; width: 100vw; height: 100dvh; touch-action: none; cursor: grab; }
  .glass { background: rgba(16,24,20,.62); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .brand { position: fixed; left: 16px; top: calc(14px + env(safe-area-inset-top, 0px)); font-weight: 800; font-size: 17px; text-shadow: 0 1px 6px rgba(0,0,0,.55); pointer-events: none; max-width: 70vw; }
  .brand small { display: block; font-weight: 500; font-size: 12.5px; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tip { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; white-space: nowrap; pointer-events: none; transition: opacity .6s; }
  .pts { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; gap: 4px; padding: 4px; border-radius: 999px; }
  .pts button { min-width: 48px; min-height: 48px; padding: 0 16px; border: 0; border-radius: 999px; background: transparent; color: #fff; font: 700 15px inherit; cursor: pointer; }
  .pts button[aria-pressed="true"] { background: #fff; color: #16392c; }
  .dn { position: fixed; right: 12px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 4px; padding: 4px; border-radius: 999px; }
  .dn button[hidden] { display: none; }
  .dn button { min-width: 48px; min-height: 48px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: #fff; font: 700 17px inherit; cursor: pointer; }
  .dn button[aria-pressed="true"] { background: #ffd59a; color: #1c1407; }
  @media (max-width: 520px) { .pts { left: 12px; transform: none; } .pts button { padding: 0 11px; font-size: 14px; } .dn { right: 12px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); } .tip { bottom: calc(140px + env(safe-area-inset-bottom, 0px)); } }
  .hot { position: fixed; transform: translate(-50%, -50%); width: 58px; height: 58px; border-radius: 50%; border: 2px solid #fff; background: rgba(22,57,44,.72); color: #fff; font: 800 18px inherit; cursor: pointer; box-shadow: 0 0 0 6px rgba(255,255,255,.22); }
  .hot span { display: block; font-size: 10px; font-weight: 600; margin-top: -2px; }
  [hidden] { display: none !important; }
  /* phones: the legal mention sits under the title instead of running into it */
  @media (max-width: 600px) { body .legal { right: auto; left: 16px; top: calc(54px + env(safe-area-inset-top, 0px)); font-size: 10.5px; } .brand { max-width: calc(100vw - 32px); } }
  /* inside the studio: the studio's own buttons take the top of the screen */
  body.embed .brand { display: none; }
  body.embed .legal { right: auto; left: 16px; top: calc(70px + env(safe-area-inset-top, 0px)) !important; }
  @media (min-width: 601px) { body.embed .legal { top: calc(22px + env(safe-area-inset-top, 0px)); } }
  .load { position: fixed; inset: 0; display: grid; place-items: center; background: #0b1410; font-size: 15px; transition: opacity .4s; }
  .legal { position: fixed; right: 12px; top: calc(16px + env(safe-area-inset-top, 0px)); font-size: 11px; opacity: .8; text-shadow: 0 1px 4px rgba(0,0,0,.6); pointer-events: none; }
</style>
</head>
<body>
<div class="brand">Vertificiel<small id="name">Visite 360° de votre jardin</small></div>
<span class="legal">Projection indicative, non contractuelle</span>
<div class="tip glass" id="tip">Glissez pour regarder autour de vous</div>
<div class="pts glass" id="pts" hidden></div>
<div class="dn glass" id="dn" hidden><button type="button" id="dnBefore" aria-pressed="false" aria-label="Voir le lieu aujourd'hui" hidden>Avant</button><button type="button" id="dnDay" aria-pressed="true" aria-label="Voir le projet de jour">☀︎</button><button type="button" id="dnNight" aria-pressed="false" aria-label="Voir le projet de nuit">☾</button></div>
<div class="load" id="load">Chargement de la visite…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  if (/[?&]e=1\b/.test(location.search)) document.body.classList.add("embed");
  const T = THREE, K = Math.PI * 9 / 21, EYE = 1.6;          // cylindrical panoramas, 21:9: they reach atan(K) = 53° up and down
  // the visit travels in the link itself: #<base64url of {n: name, p: [{u: image, x, z, y: heading of the image centre, l: label}]}>
  let V = null;
  try { const h = location.hash.slice(1); if (h) V = JSON.parse(decodeURIComponent(escape(atob(h.replace(/-/g, "+").replace(/_/g, "/"))))); } catch (e) { V = null; }
  if (!V || !Array.isArray(V.p) || !V.p.length) V = { n: "Jardin de démonstration", p: [{ u: "img/demo/pano-test.jpg", x: 0, z: 0, y: 0, l: "1" }] };
  V.p = V.p.filter(p => p && typeof p.u === "string" && (/^https:\/\//.test(p.u) || /^img\//.test(p.u))).slice(0, 6);
  const IA = /[?&]demo=blender-ia\b/.test(location.search);
  if (/[?&]demo=blender/.test(location.search)) V = { n: "Jardin de démonstration · " + (IA ? "Blender + IA" : "rendu Blender"), p: [1, 2, 3].map(i => ({ u: "img/demo/blender-" + (IA ? "ia-" : "") + i + ".jpg", e: IA ? 2 : 1, ...[{ x: -2.5, z: 12.5, y: 0.193 }, { x: 2.5, z: 3.5, y: -2.471 }, { x: 9.5, z: 2.5, y: -2.088 }][i - 1], l: String(i) })) };
  document.getElementById("name").textContent = "Visite 360° · " + String(V.n || "votre jardin").slice(0, 80);
  const renderer = new T.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1)); renderer.outputEncoding = T.sRGBEncoding; document.body.prepend(renderer.domElement);
  const scene = new T.Scene(), camera = new T.PerspectiveCamera(62, 1, 0.01, 10);
  // two kinds of panoramas: cylindrical 21:9 (AI) or full-sphere 2:1 (Blender, "e": 1)
  const mat = new T.MeshBasicMaterial({ side: T.BackSide }), cyl = new T.Mesh(new T.CylinderGeometry(1, 1, 2 * K, 120, 1, true), mat), sph = new T.Mesh(new T.SphereGeometry(1, 96, 64), mat),
    band = new T.Mesh(new T.SphereGeometry(1, 96, 64, 0, 2 * Math.PI, (Math.PI - 2 * Math.PI * 9 / 21 / 2) / 2, 2 * Math.PI * 9 / 21 / 2), mat);      // "e": 2, a 21:9 band of a sphere, ±77°
  scene.add(cyl, sph, band); sph.visible = band.visible = false; let sphere = false;
  const loader = new T.TextureLoader(); loader.setCrossOrigin("anonymous");
  let cur = -1, yaw = 0, pitch = 0, fov = 62, vel = 0, last = 0, mode = "day";
  const relay = u => (/^https:\/\/tempfile\.redpandaai\.co\//.test(u) ? "api/render?img=" + encodeURIComponent(u) : u);
  V.p.forEach(p => { if (typeof p.n !== "string" || !/^https:\/\//.test(p.n)) delete p.n; });
  const dn = document.getElementById("dn"); dn.hidden = !V.p.some(p => p.n);
  V.p.forEach(p => { if (typeof p.b !== "string" || !/^https:\/\//.test(p.b)) delete p.b; });
  dn.hidden = !V.p.some(p => p.n || p.b); document.getElementById("dnBefore").hidden = !V.p.some(p => p.b); document.getElementById("dnNight").hidden = !V.p.some(p => p.n);
  const setMode = m => { if (m !== mode && cur >= 0) { mode = m; show(cur); } };
  document.getElementById("dnDay").addEventListener("click", () => setMode("day"));
  document.getElementById("dnNight").addEventListener("click", () => { if (V.p[cur] && V.p[cur].n) setMode("night"); });
  document.getElementById("dnBefore").addEventListener("click", () => { if (V.p[cur] && V.p[cur].b) setMode("before"); });
  const hots = V.p.map((p, i) => { const b = document.createElement("button"); b.className = "hot"; b.innerHTML = "↑<span>" + (i + 1) + "</span>"; b.setAttribute("aria-label", "Aller au point " + (i + 1)); b.hidden = true; b.addEventListener("click", () => show(i)); document.body.appendChild(b); return b; });
  const bar = document.getElementById("pts");
  if (V.p.length > 1) { bar.hidden = false; V.p.forEach((p, i) => { const b = document.createElement("button"); b.textContent = /^\d*$/.test(String(p.l || "")) ? i + 1 : String(p.l).slice(0, 14); b.setAttribute("aria-label", "Point de vue " + (i + 1)); b.addEventListener("click", () => show(i)); bar.appendChild(b); }); }
  function show(i) {
    // keep looking in the same direction of the garden when moving to another point
    const head = cur >= 0 ? (V.p[cur].y || 0) - yaw : null, m = mode === "night" && V.p[i].n ? "night" : mode === "before" && V.p[i].b ? "before" : "day";
    // our stored panoramas come through the studio's relay (their host sends no CORS header, which a 3D view needs)
    const src = relay(m === "night" ? V.p[i].n : m === "before" ? V.p[i].b : V.p[i].u);
    loader.load(src, tex => {
      tex.encoding = T.sRGBEncoding; tex.wrapS = T.RepeatWrapping; tex.repeat.x = -1; tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      if (mat.map) mat.map.dispose(); mat.map = tex; mat.needsUpdate = true; cur = i;
      sphere = V.p[i].e === 1 ? 1 : V.p[i].e === 2 ? 2 : 0; sph.visible = sphere === 1; band.visible = sphere === 2; cyl.visible = !sphere;
      yaw = head == null ? 0 : (V.p[i].y || 0) - head;
      [...bar.children].forEach((b, k) => b.setAttribute("aria-pressed", String(k === i)));
      document.getElementById("dnDay").setAttribute("aria-pressed", String(m === "day")); document.getElementById("dnNight").setAttribute("aria-pressed", String(m === "night")); document.getElementById("dnBefore").setAttribute("aria-pressed", String(m === "before"));
      document.getElementById("dnNight").disabled = !V.p[i].n; document.getElementById("dnBefore").disabled = !V.p[i].b;
      const l = document.getElementById("load"); l.style.opacity = 0; setTimeout(() => { l.hidden = true; }, 400); draw();
    }, undefined, () => { document.getElementById("load").textContent = "Cette visite n'est plus disponible. Demandez un nouveau lien à votre conseiller Vertificiel."; document.getElementById("load").hidden = false; document.getElementById("load").style.opacity = 1; });
  }
  const v3 = new T.Vector3();
  function draw() {
    const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = fov; camera.updateProjectionMatrix();
    const lim = sphere === 1 ? 1.45 : sphere === 2 ? Math.max(0, 1.34 - fov * Math.PI / 360) : Math.max(0, Math.atan(K) - fov * Math.PI / 360 - 0.02); pitch = Math.max(-lim, Math.min(lim, pitch));
    camera.rotation.set(pitch, yaw, 0, "YXZ"); camera.updateMatrixWorld(); renderer.render(scene, camera);
    // arrows towards the other points, on the ground where they stand
    hots.forEach((b, i) => {
      if (i === cur || cur < 0) { b.hidden = true; return; }
      const p = V.p[cur], q = V.p[i], dx = q.x - p.x, dz = q.z - p.z, d = Math.hypot(dx, dz);
      if (!(d > 0.5)) { b.hidden = true; return; }
      const a = Math.atan2(dx, -dz) - (p.y || 0), down = Math.min(0.75, Math.max(0.18, EYE / d));
      v3.set(Math.sin(a), -down, -Math.cos(a)).project(camera);
      const vis = v3.z < 1 && Math.abs(v3.x) < 0.92 && Math.abs(v3.y) < 0.8;
      b.hidden = !vis; if (vis) { b.style.left = ((v3.x + 1) / 2 * w) + "px"; b.style.top = ((1 - v3.y) / 2 * h) + "px"; }
    });
  }
  const pts = new Map(); let pinch = 0; const cv = renderer.domElement;
  cv.addEventListener("pointerdown", e => { cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); vel = 0; document.getElementById("tip").style.opacity = 0; });
  cv.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId)) return;
    const p = pts.get(e.pointerId), dx = e.clientX - p[0], dy = e.clientY - p[1]; pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size === 2) { const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (pinch) fov = Math.max(35, Math.min(75, fov * pinch / d)); pinch = d; draw(); return; }
    const k = fov * Math.PI / 180 / innerHeight; yaw += dx * k; pitch += dy * k; vel = dx * k; last = performance.now(); draw();
  });
  const up = e => { pts.delete(e.pointerId); pinch = 0; if (performance.now() - last < 60 && Math.abs(vel) > 0.002) requestAnimationFrame(glide); };
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
  function glide() { if (pts.size || Math.abs(vel) < 0.0004) return; yaw += vel; vel *= 0.94; draw(); requestAnimationFrame(glide); }
  cv.addEventListener("wheel", e => { e.preventDefault(); fov = Math.max(35, Math.min(75, fov + e.deltaY * 0.03)); draw(); }, { passive: false });
  addEventListener("resize", draw); show(0);
  window.__view = (y, p) => { yaw = y; pitch = p || 0; draw(); };
})();
</script>
</body>
</html>
