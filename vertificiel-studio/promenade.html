<body>
<div class="brand">Vertificiel<small id="name">Promenade dans votre projet</small><em>Maquette 3D indicative, non contractuelle</em></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const T = THREE, EYE = 1.65, SLAB = 0.8, JOINT = 0.1, CELL = SLAB + JOINT;

    n: "Jardin de démonstration", r: 0, lim: 26, da: 45, s: [0, 17, 0],

  };

  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
  if (R) {
    const far = new T.Mesh(new T.PlaneGeometry(3000, 3000), new T.MeshLambertMaterial({ color: AVG })); far.rotation.x = -Math.PI / 2; far.position.y = -0.06; scene.add(far);
    const lat = W.o[1], lon = W.o[0], dla = R / 110574, dlo = R / (111320 * Math.cos(lat * Math.PI / 180));
    const url = "https://data.geopf.fr/wms-r?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap&LAYERS=HR.ORTHOIMAGERY.ORTHOPHOTOS&STYLES=&CRS=EPSG:4326&BBOX=" + [lat - dla, lon - dlo, lat + dla, lon + dlo].map(v => v.toFixed(7)).join(",") + "&WIDTH=2048&HEIGHT=2048&FORMAT=image/jpeg";
    const ld = new T.TextureLoader(); ld.setCrossOrigin("anonymous");
    ld.load(url, t => { t.encoding = T.sRGBEncoding; t.anisotropy = ANI; ground.material.map = t; ground.material.needsUpdate = true; need = true; }, undefined, () => { ground.material.color.set(AVG); need = true; });

    const g = new T.ShapeGeometry(sh), pos = g.attributes.position, uv = g.attributes.uv, per = z.t === "d" ? N4 * CELL : z.t === "p" ? 2.4 : 6, a = z.t === "d" ? DA : 0.5;

    for (let k = 0; k < 7; k++) { const a = k * 0.9 + rnd() * 0.6, d = k ? r * (0.3 + rnd() * 0.3) : 0, c = new T.Mesh(ico, crownM[k % 3]); c.scale.set(r * (0.5 + rnd() * 0.25), r * (0.2 + rnd() * 0.1), r * (0.5 + rnd() * 0.25)); c.position.set(Math.cos(a) * d, th + r * 0.12 + rnd() * r * 0.14, Math.sin(a) * d); c.castShadow = true; g.add(c); }
    g.position.set(x, 0, z); g.rotation.y = rnd() * 6.3; scene.add(g); solid.push([x, z, 0.5]); pines.push([x, z, h]);
  });
  const SPR = [["img/arbres/pin-1.webp", 641 / 1024, 0.514], ["img/arbres/pin-2.webp", 601 / 1024, 0.424]], cards = [], cardM = [], tl = new T.TextureLoader(); let got = 0;
  SPR.forEach((sp, k) => tl.load(sp[0], t => {

    setNight(night);
  }));

  // ---- buildings
  const wallM = new T.MeshLambertMaterial({ color: 0xe6dfcf, side: T.DoubleSide }), roofM = new T.MeshLambertMaterial({ color: 0xa2664a, side: T.DoubleSide }), woodM = new T.MeshLambertMaterial({ color: 0x8a6a4a }), winM = new T.MeshBasicMaterial({ color: 0x27323a, side: T.DoubleSide }), boxes = [];
  const tri = (v, mat) => { const g = new T.BufferGeometry(); g.setAttribute("position", new T.Float32BufferAttribute(v, 3)); g.computeVertexNormals(); const m = new T.Mesh(g, mat); m.castShadow = true; m.receiveShadow = true; scene.add(m); return m; };
